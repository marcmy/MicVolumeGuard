name: PowerShell Quality

on:
  push:
    branches:
      - main
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-quality.yml"
  pull_request:
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - ".github/workflows/powershell-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          $files = Get-ChildItem -Path . -Recurse -File | Where-Object {
            $_.Extension -in '.ps1', '.psm1', '.psd1'
          }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            foreach ($parseError in $errors) {
              $failures.Add("$($file.FullName):$($parseError.Extent.StartLineNumber): $($parseError.Message)")
            }
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed with $($failures.Count) error(s)."
          }

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Repository PSGallery -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning)
          if ($results.Count -eq 0) {
            Write-Host 'PSScriptAnalyzer found no errors or warnings.'
            exit 0
          }

          $results |
            Sort-Object ScriptName, Line, RuleName |
            Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize |
            Out-String -Width 240 |
            Write-Host

          throw "PSScriptAnalyzer reported $($results.Count) error(s) or warning(s)."
